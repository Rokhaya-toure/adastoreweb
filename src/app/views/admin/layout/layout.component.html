<div class="min-h-screen bg-stone-100 text-slate-900 lg:flex">

  <header class="flex items-center justify-between bg-slate-900 px-4 py-3 text-white lg:hidden">
    <span class="text-lg font-extrabold tracking-tight">Adastor</span>
    <button type="button" (click)="menuOpen.set(!menuOpen())"
            [attr.aria-expanded]="menuOpen()" aria-label="Ouvrir le menu"
            class="rounded-lg px-3 py-1.5 text-xl hover:bg-white/10">☰</button>
  </header>

  <aside [class.hidden]="!menuOpen()"
         class="bg-slate-900 pb-6 text-slate-300 lg:sticky lg:top-0 lg:block lg:h-screen lg:w-64 lg:shrink-0 lg:overflow-y-auto">
    <div class="hidden px-6 pb-4 pt-6 lg:block">
      <p class="text-2xl font-extrabold tracking-tight text-white">Adastor<span class="text-amber-400">.</span></p>
      <p class="mt-0.5 text-xs text-slate-500">Espace administration</p>
    </div>

    <nav class="space-y-5 px-3 pt-3 lg:pt-0">
      @for (g of groups; track g.title) {
        <div>
          <p class="px-3 pb-1 text-xs font-semibold text-slate-500">{{ g.title }}</p>
          @for (l of g.links; track l.path) {
            <a [routerLink]="'/admin/' + l.path" routerLinkActive="border-amber-400 bg-white/10 text-white"
               (click)="menuOpen.set(false)"
               class="flex items-center justify-between rounded-r-lg border-l-2 border-transparent px-3 py-2 text-sm font-medium hover:bg-white/5 hover:text-white">
              {{ l.label }}
              @if (l.badge && count(l.badge) > 0) {
                <span class="rounded-full bg-amber-400 px-2 py-0.5 text-xs font-bold text-slate-900">{{ count(l.badge) }}</span>
              }
            </a>
          }
        </div>
      }
    </nav>

    <button type="button" class="mx-6 mt-8 text-sm text-slate-500 hover:text-white">Déconnexion</button>
  </aside>

  <main class="min-w-0 flex-1 p-4 lg:p-8"><router-outlet /></main>
</div>
